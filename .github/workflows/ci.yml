on:
  push:
  pull_request:
    branches: [master]
jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Build and install libucl from source
        run: |
          sudo apt-get install -y cmake
          git clone --depth 1 https://github.com/vstakhov/libucl.git /tmp/libucl
          cmake -S /tmp/libucl -B /tmp/libucl/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          sudo cmake --build /tmp/libucl/build --target install
      - name: Install development dependencies
        run: shards install
      - name: Run tests
        run: make lint spec
      - name: Run examples
        run: make examples
      - name: Make sure the files are formatted
        run: crystal tool format --check

  verify-macos:
    runs-on: macos-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install libucl and Crystal
        run: brew install libucl crystal
      - name: Install development dependencies
        run: shards install
      - name: Run tests
        run: make lint spec
      - name: Run examples
        run: make examples
      - name: Make sure the files are formatted
        run: crystal tool format --check
