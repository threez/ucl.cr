on:
  push:
  pull_request:
    branches: [master]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: |
            lib
            .shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-
      - name: Install development dependencies
        run: shards install
      - name: Build ameba
        run: cd lib/ameba && shards build ameba
      - name: Make sure the files are formatted
        run: crystal tool format --check
      - name: Run ameba lint
        run: lib/ameba/bin/ameba
      - name: Build and install libucl from source
        run: |
          sudo apt-get install -y cmake
          git clone --depth 1 https://github.com/vstakhov/libucl.git /tmp/libucl
          cmake -S /tmp/libucl -B /tmp/libucl/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          sudo cmake --build /tmp/libucl/build --target install
      - name: Compile check
        run: crystal build src/ucl.cr -o /tmp/ucl_check --no-codegen

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: |
            lib
            .shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-shards-
      - name: Install development dependencies
        run: shards install
      - name: Build and install libucl from source (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y cmake
          git clone --depth 1 https://github.com/vstakhov/libucl.git /tmp/libucl
          cmake -S /tmp/libucl -B /tmp/libucl/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          sudo cmake --build /tmp/libucl/build --target install
      - name: Install libucl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libucl
          # crystal-lang/install-crystal's prebuilt binary doesn't inherit
          # Homebrew's library search paths the way a brew-installed crystal
          # would, so -lucl isn't found at link time without this.
          echo "LIBRARY_PATH=$(brew --prefix libucl)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix libucl)/include:$CPATH" >> "$GITHUB_ENV"
      - name: Run tests
        run: crystal spec --order=random
      - name: Run examples
        run: make examples
